<script>(function(){var P=JSON.parse(document.getElementById('payload').textContent);function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
document.getElementById('f').addEventListener('submit',async function(e){e.preventDefault();var err=document.getElementById('err');err.textContent='';try{var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);var pt=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c)));document.open();document.write(pt);document.close();}catch(x){err.textContent='That password is not correct. Please try again.';}});})();</script></body></html>
