<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bryte Monthly Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,401,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0c0e;--surface:#1a1e23;--surface-2:#1e2125;--paper:#f4efe8;
  --signal:#e8ff59;--mute:#8a9099;--coral:#ff5e4d;--line:#2a2f36;--radius:6px;
  --display:"Zodiak",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink);color:var(--paper)}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;text-wrap:pretty}
::selection{background:var(--signal);color:var(--ink)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
html{scroll-snap-type:y mandatory}

/* gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow:hidden}
#gate::before{content:"";position:absolute;width:420px;height:420px;border:1px solid var(--paper);border-radius:50%;right:-160px;top:-160px;opacity:.08;pointer-events:none}
.gate-card{background:var(--surface);border-radius:var(--radius);padding:36px 32px;max-width:400px;width:100%}
.gate-card h1{font-family:var(--display);font-weight:500;font-size:26px;margin:18px 0 8px}
.gate-card p{margin:0 0 22px;font-size:15px;color:var(--mute);line-height:1.5}
.gate-card form{display:flex;flex-direction:column;gap:10px}
.gate-card input{font:inherit;font-size:16px;padding:12px 14px;border:1px solid #33383f;border-radius:var(--radius);background:var(--surface-2);color:var(--paper)}
.gate-card input:focus{outline:2px solid var(--signal);outline-offset:1px}
.gate-card button{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:13px 14px;border:0;border-radius:var(--radius);background:var(--signal);color:var(--ink);cursor:pointer}
#err{color:var(--coral);font-size:14px;min-height:20px;margin-top:4px}
.wordmark{display:inline-flex;align-items:baseline;gap:6px}
.wordmark .ogs{font-family:var(--display);font-style:italic;font-size:30px;line-height:1}
.wordmark .media{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.18em}

/* deck */
#report{display:none}
.deck{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 0}
.slide{
  --w:min(calc(100vw - 32px), calc((100vh - 32px) * 16 / 9));
  width:var(--w);aspect-ratio:16/9;container-type:inline-size;
  background:var(--ink);border:1px solid var(--line);border-radius:var(--radius);
  position:relative;padding:4.5cqw 5.25cqw 6cqw;overflow:hidden;
  scroll-snap-align:center;display:flex;flex-direction:column;
}
.slide p,.slide ul,.slide ol,.slide dl,.slide h1,.slide h2,.slide figure{margin:0}
.kicker,.label,.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.kicker{font-size:1.05cqw;color:var(--mute)}
.mono{font-size:1cqw;text-transform:none}
h2{font-family:var(--display);font-weight:500;font-size:3cqw;line-height:1.2;margin-top:1.4cqw !important;margin-bottom:2.8cqw !important;letter-spacing:-.01em;text-wrap:balance}
.label{font-size:1.05cqw;margin-bottom:1.3cqw !important;color:var(--paper)}
.lime{color:var(--signal)!important}.coral{color:var(--coral)!important}.mute{color:var(--mute)!important}
.slide p,.slide li,.slide dd{font-size:1.45cqw;line-height:1.5}
.card{background:var(--surface);border-radius:var(--radius);padding:2.4cqw 2.6cqw}
.card.outline{box-shadow:inset 0 0 0 1.5px var(--signal)}
.card p+p{margin-top:.8cqw}
.card ul,.plain ul{padding-left:1.2em}
.card li+li{margin-top:1cqw}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:2.5cqw}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2.2cqw}
.grid3 .card li+li{margin-top:1.6cqw}
.stack{display:flex;flex-direction:column;gap:2.2cqw}
.pg{position:absolute;left:5.25cqw;right:5.25cqw;bottom:2.4cqw;display:flex;justify-content:space-between;align-items:baseline}
.pg .mono{font-size:.85cqw}
.wm{font-family:var(--display);font-size:1.5cqw;letter-spacing:.04em;white-space:nowrap}
.wm.sm{font-size:1cqw}
.note{margin-top:auto !important;font-family:var(--mono);font-size:.9cqw !important;color:var(--mute)}
.lead{margin-top:auto !important;font-size:1.65cqw !important;line-height:1.4 !important}
.quote{font-family:var(--display);font-size:1.7cqw !important;line-height:1.35 !important}

/* title */
.title-slide{justify-content:center;padding-left:5.25cqw}
.title-slide .kicker{font-size:1.2cqw}
.brand{font-family:var(--display);font-weight:400;font-size:6.6cqw;line-height:1.05;margin:1.2cqw 0 1.6cqw !important}
.brand.q{font-size:4.5cqw}
.month{font-family:var(--display);font-size:2cqw !important;color:var(--coral)}
.title-slide .mono.lime{font-size:1.2cqw}
.foot{position:absolute;left:5.25cqw;right:5.25cqw;bottom:3.4cqw;display:flex;justify-content:space-between;align-items:baseline}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1.5cqw;margin-bottom:2.6cqw}
.num{font-family:var(--display);font-size:3.8cqw !important;line-height:1.1 !important}
.stats .label{margin:.6cqw 0 .3cqw !important;font-size:.95cqw}
.was{font-size:1.2cqw !important;color:var(--mute)}
.big{font-family:var(--display);font-size:5.5cqw !important;line-height:1.1 !important}
.plain .label{margin:.6cqw 0 1.4cqw !important;max-width:38cqw}
ul.clean{list-style:none;padding:0 !important}
ul.clean li{font-size:1.5cqw !important;padding:.7cqw 0;border-top:1px solid var(--line)}

/* chart */
.chart{display:flex;flex-direction:column}
.bars{flex:1;display:flex;align-items:flex-end;gap:1.6cqw;height:25cqw;border-bottom:1px solid var(--line);padding-top:1cqw}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bar i{display:block;width:100%;height:calc(var(--v) / 175 * 85%);background:#3a4048;border-radius:3px 3px 0 0}
.bar.hi i{background:var(--coral)}
.bar span{font-family:var(--display);font-size:1.6cqw;margin-bottom:.5cqw}
.bar b{position:absolute;bottom:-2.2cqw;font-family:var(--mono);font-weight:400;font-size:.95cqw;color:var(--mute);white-space:nowrap}

/* screenshots */
.shots{flex:1;min-height:0;align-items:start}
.shots figure{display:flex;flex-direction:column;gap:1.2cqw;min-height:0}
.shots img{width:100%;max-height:22cqw;object-fit:cover;object-position:top;border-radius:var(--radius);border:1px solid var(--line);display:block}
.shots figcaption{font-size:1.3cqw;line-height:1.45}
.shots figcaption .label{display:block;margin-bottom:.6cqw !important}

.riley{grid-template-columns:1fr 1fr .78fr;align-items:start}
.riley figure{display:flex;flex-direction:column;gap:.9cqw}
.riley img{width:100%;border-radius:var(--radius);border:1px solid var(--line);display:block}
.riley figcaption{font-size:1.05cqw;color:var(--mute);line-height:1.4}

.audit{margin:-.4cqw 0 .6cqw !important}.audit .big{font-size:3.6cqw !important}
.opts{display:grid;grid-template-columns:1fr 1.3fr;gap:2.2cqw;margin-bottom:1.8cqw}
.opts .card{padding:1.8cqw 2.2cqw}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2cqw 2.2cqw;margin-bottom:1.8cqw}
.example{padding:1.4cqw 2.2cqw !important}.example .label{margin-bottom:.8cqw !important}.example p:not(.label){font-size:1.08cqw !important;line-height:1.4 !important}.example p+p{margin-top:.5cqw !important}
.map div{border-top:1px solid var(--line);padding-top:1cqw;display:flex;flex-direction:column;gap:.4cqw}
.map .label{margin:0 !important;font-size:.9cqw}
.map b{font-family:var(--display);font-weight:400;font-size:1.55cqw;line-height:1.3}

.cmp{width:100%;border-collapse:collapse;font-size:1.5cqw}
.cmp th,.cmp td{padding:.55cqw 1cqw;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.cmp thead th{font-family:var(--mono);text-transform:uppercase;font-size:1cqw;color:var(--mute);letter-spacing:.04em}
.cmp thead th.sep{color:var(--coral)}
.cmp tbody th{color:var(--paper);width:24%}
.cmp td{width:19%;position:relative}
.cmp td span{font-family:var(--display);font-size:1.6cqw}
.cmp td i{display:block;margin-top:.35cqw;height:.35cqw;width:calc(var(--p) * .85);background:#3a4048;border-radius:2px}
.cmp td.sep{background:rgba(255,94,77,.07)}
.cmp td.sep span{color:var(--coral)}
.cmp td.sep i{background:var(--coral)}

/* steps + asks */
.steps{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:5cqw 4cqw;margin-top:2cqw !important}
.steps li{display:grid;grid-template-columns:5cqw 1fr;align-items:baseline;font-size:1.65cqw !important;line-height:1.4 !important}
.steps span{font-family:var(--mono);font-size:1.8cqw;color:var(--signal)}
.asks{display:grid;grid-template-columns:22cqw 1fr;row-gap:3.6cqw;margin-top:1cqw !important}
.asks dt{font-family:var(--mono);text-transform:uppercase;font-size:1.1cqw;color:var(--coral);padding-top:.3cqw}
.asks dd{margin:0;font-size:1.7cqw !important;line-height:1.35 !important}

.nav{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;z-index:5}
.nav button{font-family:var(--mono);font-size:13px;background:var(--surface);color:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;cursor:pointer}

/* phones and narrow windows: slides become stacked cards with fixed type */
@media (max-width:760px){
  html{scroll-snap-type:none}
  .deck{padding:16px}
  .slide{width:100%;aspect-ratio:auto;padding:28px 20px 56px;min-height:auto}
  .kicker,.label,.mono,.note,.asks dt,.stats .label,.pg .mono{font-size:11px !important}
  h2{font-size:24px;margin:10px 0 20px !important}
  .slide p,.slide li,.slide dd,.lead,.steps li,ul.clean li{font-size:15px !important}
  .label{margin-bottom:10px !important}
  .card{padding:18px}
  .card p+p,.card li+li,.grid3 .card li+li{margin-top:8px}
  .grid2,.grid3,.stack{grid-template-columns:1fr;gap:14px;max-height:none}
  .stats{grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .num{font-size:28px !important}.was{font-size:13px !important}
  .big{font-size:40px !important}.quote{font-size:17px !important}
  .lead,.note{margin-top:20px !important}
  .wm{font-size:16px}.wm.sm{font-size:11px}
  .pg{left:20px;right:20px;bottom:18px}.foot{position:static;margin-top:40px}
  .title-slide{padding:48px 20px 28px}
  .brand{font-size:56px}.brand.q{font-size:44px}.month{font-size:22px !important}
  .bars{flex:none;height:200px;gap:10px}.bar span{font-size:14px}.bar b{font-size:10px;bottom:-20px}
  .chart{margin-bottom:32px}
  .steps{grid-template-columns:1fr;gap:16px}.steps li{grid-template-columns:40px 1fr}.steps span{font-size:16px}
  .asks{grid-template-columns:1fr;row-gap:4px}.asks dd{margin-bottom:14px}
  .shots img{max-height:none}.shots figcaption{font-size:15px}
  .riley figure{max-width:300px}.riley figcaption{font-size:13px}
  .opts,.map{grid-template-columns:1fr;gap:12px}.example p:not(.label){font-size:14px !important}.map b{font-size:17px}.map .label{font-size:11px}.map div{padding-top:10px}.audit .big{font-size:36px !important}
  .cmp{font-size:12px;display:block;overflow-x:auto}.cmp th,.cmp td{padding:8px 6px}.cmp thead th{font-size:10px}.cmp td i{display:none}
  .nav{display:none}
}
</style>
</head>

<script id="app">
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function go(d){var s=[].slice.call(document.querySelectorAll('.slide'));if(!s.length)return;
    var mid=window.innerHeight/2,cur=0;s.forEach(function(el,i){var r=el.getBoundingClientRect();if(r.top<=mid)cur=i;});
    var n=Math.max(0,Math.min(s.length-1,cur+d));s[n].scrollIntoView({behavior:'smooth',block:'center'});}
  function show(html){var r=document.getElementById('report');r.innerHTML=html;r.style.display='block';
    document.getElementById('gate').style.display='none';document.getElementById('nav').hidden=false;window.scrollTo(0,0);
    document.getElementById('prev').onclick=function(){go(-1)};document.getElementById('next').onclick=function(){go(1)};
    document.addEventListener('keydown',function(e){
      if(['ArrowDown','ArrowRight','PageDown',' '].indexOf(e.key)>-1){e.preventDefault();go(1);}
      if(['ArrowUp','ArrowLeft','PageUp'].indexOf(e.key)>-1){e.preventDefault();go(-1);}});}
  if(window.__PREVIEW__){show(window.__PREVIEW__);return;}
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();var err=document.getElementById('err');err.textContent='';
    try{
      if(!window.crypto||!crypto.subtle){err.textContent='Please open this page in an up-to-date browser such as Chrome, Safari or Edge.';return;}
      var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
      show(new TextDecoder().decode(pt));
    }catch(x){err.textContent='That password is not correct. Please try again.';}
  });
})();
</script>
