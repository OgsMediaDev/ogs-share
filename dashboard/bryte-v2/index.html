<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bryte v2 Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,401,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0c0e;--surface:#1a1e23;--surface-2:#1e2125;--paper:#f4efe8;--paper-2:#f8f3ec;--paper-ink:#16130f;
  --signal:#e8ff59;--signal-ink:#0b0c0e;--mute:#8a9099;--mute-ink:#5b6068;
  --coral:#ff5e4d;--line:#e3dccd;--radius:6px;
  --display:"Zodiak",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1{font-family:var(--display);font-weight:500;letter-spacing:-0.012em;line-height:1.15}
::selection{background:var(--signal);color:var(--signal-ink)}
:focus-visible{outline:2px solid #1f6f8b;outline-offset:2px}

#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--ink);position:relative;overflow:hidden}
#gate::before{content:"";position:absolute;width:420px;height:420px;border:1px solid var(--paper);border-radius:50%;right:-160px;top:-160px;opacity:.08;pointer-events:none}
.gate-card{background:var(--surface);border-radius:var(--radius);padding:36px 32px;max-width:400px;width:100%;color:var(--paper);position:relative}
.gate-card h1{font-size:26px;margin:18px 0 8px;color:var(--paper)}
.gate-card p{margin:0 0 22px;font-size:15px;color:var(--mute)}
.gate-card form{display:flex;flex-direction:column;gap:10px}
.gate-card input{font:inherit;padding:12px 14px;border:1px solid #33383f;border-radius:var(--radius);background:var(--surface-2);color:var(--paper)}
.gate-card button{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:13px 14px;border:0;border-radius:var(--radius);background:var(--signal);color:var(--signal-ink);cursor:pointer}
#err{color:var(--coral);font-size:14px;min-height:20px;margin-top:4px}
.wordmark{display:inline-flex;align-items:baseline;gap:6px;color:var(--paper)}
.wordmark .ogs{font-family:var(--display);font-style:italic;font-size:30px;line-height:1}
.wordmark .media{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.18em}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <div class="wordmark"><span class="ogs">ogs</span><span class="media">MEDIA</span></div>
    <h1>Bryte v2 Dashboard</h1>
    <p>Enter the password from OGS Media to view this dashboard.</p>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" name="password" placeholder="Password" autofocus required>
      <button type="submit">View dashboard</button>
      <div id="err" role="alert"></div>
    </form>
  </div>
</div>

<script>
(function(){
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function show(D){
    if(D && D.full && D.html){
      document.open();
      document.write(D.html);
      document.close();
      return;
    }
    // fallback fragment mode
    var r=document.createElement('div');
    r.id='report';
    r.innerHTML=(D && D.html) || '';
    document.body.innerHTML='';
    document.body.appendChild(r);
  }
  var raw=document.getElementById('payload').textContent;
  var P=JSON.parse(raw);
  if(P.plain){show(P.plain);return;}
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var err=document.getElementById('err');err.textContent='';
    try{
      if(!window.crypto||!crypto.subtle){err.textContent='Please open this page in an up-to-date browser such as Chrome, Safari or Edge.';return;}
      var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
      show(JSON.parse(new TextDecoder().decode(pt)));
    }catch(x){err.textContent='That password is not correct. Please try again.';}
  });
})();
</script>
