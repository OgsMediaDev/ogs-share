<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bryte Brand Mentions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,401,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0c0e;--surface:#1a1e23;--surface-2:#1e2125;--paper:#f4efe8;--paper-2:#f8f3ec;--paper-ink:#16130f;
  --signal:#e8ff59;--signal-ink:#0b0c0e;--mute:#8a9099;--mute-ink:#5b6068;
  --coral:#ff5e4d;--line:#e3dccd;--radius:6px;
  --ours:#b3ab9e;--others:#1f6f8b;
  --pos:#2e7d55;--mix:#b7801a;--neu:#8a9099;--cri:#c4422f;
  --display:"Zodiak",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--paper-ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1,h2{font-family:var(--display);font-weight:500;letter-spacing:-0.012em;text-wrap:balance;line-height:1.15}
::selection{background:var(--signal);color:var(--signal-ink)}
:focus-visible{outline:2px solid var(--others);outline-offset:2px}
a{color:var(--others)}

#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--ink);position:relative;overflow:hidden}
#gate::before{content:"";position:absolute;width:420px;height:420px;border:1px solid var(--paper);border-radius:50%;right:-160px;top:-160px;opacity:.08;pointer-events:none}
.gate-card{background:var(--surface);border-radius:var(--radius);padding:36px 32px;max-width:400px;width:100%;color:var(--paper);position:relative}
.gate-card h1{font-size:26px;margin:18px 0 8px;color:var(--paper)}
.gate-card p{margin:0 0 22px;font-size:15px;color:var(--mute)}
.gate-card form{display:flex;flex-direction:column;gap:10px}
.gate-card input{font:inherit;padding:12px 14px;border:1px solid #33383f;border-radius:var(--radius);background:var(--surface-2);color:var(--paper)}
.gate-card button{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:13px 14px;border:0;border-radius:var(--radius);background:var(--signal);color:var(--signal-ink);cursor:pointer}
#err{color:var(--coral);font-size:14px;min-height:20px;margin-top:4px}

.wordmark{display:inline-flex;align-items:baseline;gap:6px;color:var(--paper)}
.wordmark .ogs{font-family:var(--display);font-style:italic;font-size:30px;line-height:1}
.wordmark .media{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.18em}

#report{display:none}
.hero{background:var(--ink);color:var(--paper);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:520px;height:520px;border:1px solid var(--paper);border-radius:50%;right:-200px;bottom:-260px;opacity:.09;pointer-events:none}
.hero-inner{max-width:960px;margin:0 auto;padding:40px 24px 48px;position:relative;z-index:1}
.eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--mute);margin:34px 0 12px}
.hero h1{color:var(--paper);font-size:clamp(32px,5.4vw,52px);margin:0 0 14px}
.meta{margin:0 0 22px;font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.04em}
.lede{max-width:680px;color:#d9d3c8;margin:0 0 18px}
.keypoints{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#2a2e34}
.keypoints li{background:var(--surface);padding:16px 18px;margin:0;font-size:15px;line-height:1.45;color:var(--paper);border-top:3px solid var(--signal)}

main{max-width:960px;margin:0 auto;padding:8px 24px 48px}
section{padding:36px 0;border-bottom:1px solid var(--line)}
section:last-child{border-bottom:0}
h2{font-size:clamp(24px,3.4vw,32px);margin:0 0 16px;color:var(--paper-ink)}
p{margin:0 0 12px;max-width:720px}
.note{font-family:var(--mono);font-size:12px;color:var(--mute-ink);max-width:none}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:4px 0 26px;background:#2a2e34}
.tile{background:var(--surface);padding:18px 18px 16px}
.tile.accent{border-top:3px solid var(--others);padding-top:15px}
.num{display:block;font-family:var(--display);font-size:38px;font-weight:500;line-height:1.05}
.tile .num{color:var(--paper)}
.lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:6px}

.chart{margin:0 0 22px;padding:20px;background:var(--paper-2);border:1px solid var(--line)}
.chart-title{font-weight:700;font-size:15px;margin-bottom:10px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mute-ink);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}

.bars{display:flex;justify-content:space-around;align-items:flex-end;height:240px;border-bottom:1px solid #cfc7b8;padding:0 8px;gap:12px}
.bgroup{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;flex:1;max-width:200px;position:relative}
.pair{display:flex;align-items:flex-end;gap:2px;height:calc(100% - 4px);width:100%;justify-content:center}
.bar{width:42%;max-width:64px;height:calc(var(--h) / 60 * 100%);min-height:4px;border-radius:4px 4px 0 0;position:relative;cursor:default}
.bar.ours{background:var(--ours)}
.bar.others{background:var(--others)}
.bar b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--paper-ink);padding-bottom:3px;font-variant-numeric:tabular-nums}
.blabel{position:absolute;top:100%;font-family:var(--mono);font-size:12px;color:var(--mute-ink);padding-top:6px}
#growth .chart .note{margin-top:34px}

.stack,.mstack{display:flex;gap:2px;height:38px}
.seg{flex:var(--n) 0 0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;min-width:6px}
.stack .seg:first-child,.mstack .seg:first-child{border-radius:4px 0 0 4px}
.stack .seg:last-child,.mstack .seg:last-child{border-radius:0 4px 4px 0}
.seg.pos{background:var(--pos)}.seg.mix{background:var(--mix)}.seg.neu{background:var(--neu)}.seg.cri{background:var(--cri)}
.tone-legend{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(2,1fr);gap:6px 20px;font-size:14px}
.tone-legend li{display:flex;gap:8px;align-items:baseline;margin:0}
.tone-legend strong{min-width:64px}
.months .mrow{display:grid;grid-template-columns:90px 1fr 32px;align-items:center;gap:10px;margin-bottom:8px}
.mlabel{font-family:var(--mono);font-size:12px;color:var(--mute-ink)}
.mstack{height:24px;width:calc(var(--t) / 11 * 100%)}
.mtot{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

.method{margin:14px 0 0;background:var(--paper-2);border:1px solid var(--line);padding:12px 16px;max-width:760px}
.method summary{cursor:pointer;font-weight:700;font-size:15px}
.method p,.method li{font-size:14.5px;line-height:1.5}
.method p{margin:10px 0 0}.method ul{margin:8px 0 0;padding-left:20px}.method li{margin:0 0 6px}
.defbox{background:var(--paper-2);border-left:3px solid var(--others);padding:18px 20px}
.defbox p:last-child{margin-bottom:0}
.answer{padding-top:10px;border-top:1px solid var(--line)}

.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:14px 0 16px}
.level{background:var(--paper-2);border:1px solid var(--line);padding:16px 18px}
.level .num{color:var(--paper-ink);font-size:34px}
.lname{display:block;font-weight:700;margin-top:4px}
.ldef{display:block;font-size:14px;color:var(--mute-ink);margin-bottom:10px}
.ex{font-size:14px;line-height:1.5;border-top:1px solid var(--line);padding-top:10px;margin:0}
.owners{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);padding:14px 18px}
.owners .num{color:var(--signal);font-size:34px}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:8px}
.card{background:var(--paper-2);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column}
.card h3{font-family:var(--body);font-size:17px;margin:0;display:flex;justify-content:space-between;gap:10px}
.card h3 .c{font-family:var(--display);font-size:26px;font-weight:500;line-height:1}
.cbar{height:6px;background:#e7e0d3;border-radius:3px;margin:8px 0 10px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--paper-ink);border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-ink);margin-bottom:8px}
.card p,.card ul{font-size:14.5px;line-height:1.5;margin:0 0 10px}
.card ul{padding-left:18px}.card li{margin:0 0 2px}
.card button{margin-top:auto;align-self:flex-start;font-family:var(--mono);font-size:12px;letter-spacing:.04em;background:none;border:1px solid var(--paper-ink);border-radius:var(--radius);padding:6px 10px;cursor:pointer;color:var(--paper-ink)}
.card button:hover{background:var(--paper-ink);color:var(--paper)}

.filters{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin:0 0 14px;font-size:14px}
.filters label{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute-ink)}
.filters select{font:inherit;font-family:var(--body);text-transform:none;letter-spacing:0;font-size:14px;color:var(--paper-ink);padding:7px 10px;border:1px solid #cfc7b8;border-radius:var(--radius);background:var(--paper-2)}
.count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mute-ink)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--paper-2)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute-ink);white-space:nowrap;background:var(--paper)}
tbody tr:last-child td{border-bottom:0}
td.nw{white-space:nowrap}
td.said{min-width:260px}
.vr{display:inline-block;white-space:nowrap;font-size:13px}
.tone{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.empty{padding:18px;color:var(--mute-ink)}

ol{list-style:none;padding-left:0;counter-reset:n;margin:0}
ol>li{counter-increment:n;position:relative;padding-left:44px;margin:0 0 14px;max-width:760px}
ol>li::before{content:counter(n);position:absolute;left:0;top:1px;width:28px;height:28px;border-radius:var(--radius);background:var(--signal);color:var(--signal-ink);font-family:var(--mono);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}

footer{background:var(--ink);color:var(--mute);text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:24px 16px}
footer p{margin:0 auto}
.fm{color:var(--paper)}
#tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;padding:6px 9px;border-radius:4px;max-width:260px;line-height:1.35}

@media (max-width:760px){
  body{font-size:16px}
  .hero-inner{padding:30px 16px 36px}
  main{padding:0 16px 32px}
  .keypoints,.levels,.cards{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .num{font-size:30px}
  .tone-legend{grid-template-columns:1fr}
  .months .mrow{grid-template-columns:70px 1fr 26px}
  .chart{padding:14px}
  .bars{height:200px}
  .count{margin-left:0;width:100%}
  table.log thead{display:none}
  table.log,table.log tbody,table.log tr,table.log td{display:block;width:100%}
  table.log tr{border-bottom:1px solid var(--line);padding:10px 12px}
  table.log td{border:0;padding:2px 0;white-space:normal;min-width:0}
  table.log td[data-l]::before{content:attr(data-l) ": ";font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute-ink)}
  .table-wrap{overflow:visible}
}
@media print{#gate{display:none!important}#report{display:block!important}.filters{display:none}}
</style>
</head>

      <button type="submit">View dashboard</button>
      <div id="err" role="alert"></div>

  </div>
</div>

<script id="app">
(function(){
  var TONE={Positive:'pos',Mixed:'mix',Neutral:'neu',Critical:'cri'};
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function opts(el,label,vals){el.innerHTML='<option value="">All</option>'+vals.map(function(v){return '<option>'+esc(v)+'</option>';}).join('');}

  function init(D){
    var rows=D.rows;
    // theme cards
    document.getElementById('cards').innerHTML=D.cards.map(function(c){
      var body=c.list?'<p>'+esc(c.text)+'</p><ul>'+c.list.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'<p>'+esc(c.text)+'</p>';
      return '<article class="card"><h3><span>'+esc(c.name)+'</span><span class="c">'+c.count+'</span></h3>'+
        '<div class="cbar" aria-hidden="true"><i style="width:'+(c.count/7*100)+'%"></i></div>'+
        '<span class="tag"><i class="sw" style="background:var(--'+c.sw+')"></i>'+esc(c.tone)+'</span>'+body+
        '<button type="button" data-theme="'+esc(c.name)+'">Show these '+c.count+' mentions</button></article>';
    }).join('');
    // filters
    var fT=document.getElementById('fTone'),fH=document.getElementById('fTheme'),fW=document.getElementById('fWho');
    opts(fT,'Tone',['Positive','Mixed','Neutral','Critical']);
    opts(fH,'Theme',D.cards.map(function(c){return c.name;}));
    opts(fW,'Who',['Owner','Shopper','Buyer who cancelled','r/Mattress regular','Media or creator','Unverified enthusiast']);
    function render(){
      var t=fT.value,h=fH.value,w=fW.value;
      var out=rows.filter(function(r){return (!t||r.tone===t)&&(!h||r.themes.indexOf(h)>=0)&&(!w||r.who===w);});
      document.getElementById('fCount').textContent='Showing '+out.length+' of '+rows.length;
      document.getElementById('logBody').innerHTML=out.length?out.map(function(r){
        var d=r.date.split('-');
        return '<tr><td class="nw" data-l="Date">'+(+d[2])+' '+MON[+d[1]-1]+'</td><td class="nw" data-l="Subreddit">'+esc(r.sub)+'</td><td data-l="Who">'+esc(r.who)+'</td>'+
          '<td data-l="Effort">'+esc(r.effort)+'</td><td data-l="Tone"><span class="tone"><i class="sw" style="background:var(--'+TONE[r.tone]+')"></i>'+esc(r.tone)+'</span></td>'+
          '<td data-l="Themes">'+(r.themes.length?esc(r.themes.join(', ')):'None')+'</td><td class="said">'+esc(r.text)+' <a class="vr" href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">View on Reddit</a></td></tr>';
      }).join(''):'<tr><td colspan="7" class="empty">No mentions match these filters.</td></tr>';
    }
    [fT,fH,fW].forEach(function(s){s.addEventListener('change',render);});
    document.getElementById('cards').addEventListener('click',function(e){
      var b=e.target.closest('button[data-theme]');if(!b)return;
      fT.value='';fW.value='';fH.value=b.getAttribute('data-theme');render();
      document.getElementById('log').scrollIntoView({behavior:'smooth'});
    });
    render();
    // tooltips
    var tip=document.getElementById('tip');
    function move(e){tip.style.left=Math.min(e.clientX+12,window.innerWidth-270)+'px';tip.style.top=(e.clientY+14)+'px';}
    document.querySelectorAll('[data-tip]').forEach(function(el){
      el.addEventListener('mouseenter',function(e){tip.textContent=el.getAttribute('data-tip');tip.hidden=false;move(e);});
      el.addEventListener('mousemove',move);
      el.addEventListener('mouseleave',function(){tip.hidden=true;});
    });
  }
  function show(D){var r=document.getElementById('report');r.innerHTML=D.html;r.style.display='block';document.getElementById('gate').style.display='none';window.scrollTo(0,0);init(D);}

  var raw=document.getElementById('payload').textContent;
  var P=JSON.parse(raw);
  if(P.plain){show(P.plain);return;}
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var err=document.getElementById('err');err.textContent='';
    try{
      if(!window.crypto||!crypto.subtle){err.textContent='Please open this page in an up-to-date browser such as Chrome, Safari or Edge.';return;}
      var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
      show(JSON.parse(new TextDecoder().decode(pt)));
    }catch(x){err.textContent='That password is not correct. Please try again.';}
  });
})();
</script>
</body>
