<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bryte AMA Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,401,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0c0e;--surface:#1a1e23;--surface-2:#1e2125;--paper:#f4efe8;--paper-ink:#16130f;
  --signal:#e8ff59;--signal-ink:#0b0c0e;--mute:#8a9099;--mute-ink:#5b6068;
  --coral:#ff5e4d;--coral-ink:#c0392b;--line:#e3dccd;--radius:6px;
  --display:"Zodiak",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--paper-ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1,h2{font-family:var(--display);font-weight:500;letter-spacing:-0.012em;text-wrap:balance;line-height:1.15}
::selection{background:var(--signal);color:var(--signal-ink)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* gate: dark ground */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--ink);position:relative;overflow:hidden}
#gate::before{content:"";position:absolute;width:420px;height:420px;border:1px solid var(--paper);border-radius:50%;right:-160px;top:-160px;opacity:.08;mix-blend-mode:screen;pointer-events:none}
.gate-card{background:var(--surface);border-radius:var(--radius);padding:36px 32px;max-width:400px;width:100%;color:var(--paper);position:relative}
.gate-card h1{font-size:26px;margin:18px 0 8px;color:var(--paper)}
.gate-card p{margin:0 0 22px;font-size:15px;color:var(--mute)}
.gate-card form{display:flex;flex-direction:column;gap:10px}
.gate-card input{font:inherit;padding:12px 14px;border:1px solid #33383f;border-radius:var(--radius);background:var(--surface-2);color:var(--paper)}
.gate-card input:focus{outline:2px solid var(--signal);outline-offset:1px}
.gate-card button{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:13px 14px;border:0;border-radius:var(--radius);background:var(--signal);color:var(--signal-ink);cursor:pointer}
#err{color:var(--coral);font-size:14px;min-height:20px;margin-top:4px}

.wordmark{display:inline-flex;align-items:baseline;gap:6px;color:var(--paper)}
.wordmark .ogs{font-family:var(--display);font-style:italic;font-size:30px;line-height:1}
.wordmark .media{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.18em}

/* report */
#report{display:none}
.hero{background:var(--ink);color:var(--paper);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:520px;height:520px;border:1px solid var(--paper);border-radius:50%;right:-200px;bottom:-260px;opacity:.09;mix-blend-mode:screen;pointer-events:none}
.hero-inner{max-width:880px;margin:0 auto;padding:40px 24px 52px;position:relative;z-index:1}
.eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--mute);margin:34px 0 12px}
.hero h1{color:var(--paper);font-size:clamp(32px,5.4vw,52px);margin:0 0 16px}
.meta{margin:0;font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.04em}
main{max-width:880px;margin:0 auto;padding:8px 24px 48px}
section{padding:34px 0;border-bottom:1px solid var(--line)}
section:last-child{border-bottom:0}
h2{font-size:clamp(24px,3.4vw,32px);margin:0 0 14px;color:var(--paper-ink)}
p{margin:0 0 14px}
ul,ol{margin:0 0 14px;padding-left:22px}
li{margin:0 0 9px}
ul li::marker{color:var(--mute-ink)}
ol{list-style:none;padding-left:0;counter-reset:n}
ol>li{counter-increment:n;position:relative;padding-left:40px}
ol>li::before{content:counter(n);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:var(--radius);background:var(--signal);color:var(--signal-ink);font-family:var(--mono);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:6px 0 26px;background:#2a2e34;border-radius:0;overflow:hidden}
.tile{background:var(--surface);padding:18px 18px 16px}
.num{display:block;font-family:var(--display);font-size:36px;font-weight:500;color:var(--paper);line-height:1.05}
.lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.quotes{list-style:none;padding-left:0}
.quotes li{font-family:var(--display);font-style:italic;font-size:19px;line-height:1.45;border-left:3px solid var(--coral);padding:2px 0 2px 16px;margin-bottom:14px}
.src{display:block;font-family:var(--mono);font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-ink);margin-top:4px}
.table-wrap{overflow-x:auto;margin:6px 0 22px;border:1px solid var(--line);border-radius:0;background:#f8f3ec}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute-ink);white-space:nowrap;background:var(--paper)}
tbody tr:last-child td{border-bottom:0}
td:not(:first-child){white-space:nowrap;font-variant-numeric:tabular-nums}
tr.hl td{background:var(--ink);color:var(--paper);font-weight:700}
.num-table td:first-child{font-weight:700}
.note{font-family:var(--mono);font-size:12px;color:var(--mute-ink)}
footer{background:var(--ink);color:var(--mute);text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:24px 16px}
footer p{margin:0}
.fm{color:var(--paper)}
@media (max-width:640px){
  body{font-size:16px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .hero-inner{padding:30px 16px 38px}
  main{padding:0 16px 32px}
  .num{font-size:30px}
}
@media print{#gate{display:none!important}#report{display:block!important}.table-wrap{overflow:visible}}
</style>
</head>

<script id="app">
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function show(html){var r=document.getElementById('report');r.innerHTML=html;r.style.display='block';document.getElementById('gate').style.display='none';window.scrollTo(0,0);}
  if(window.__PREVIEW__){show(window.__PREVIEW__);return;}
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var err=document.getElementById('err');err.textContent='';
    try{
      if(!window.crypto||!crypto.subtle){err.textContent='Please open this file in an up-to-date browser such as Chrome, Safari or Edge.';return;}
      var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
      show(new TextDecoder().decode(pt));
    }catch(x){err.textContent='That password is not correct. Please try again.';}
  });
})();
</script>
