function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++){a[i]=r.charCodeAt(i);}return a;}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var err=document.getElementById('err'),btn=document.getElementById('btn');
  if(!(window.crypto&&crypto.subtle)){err.textContent='This browser cannot decrypt the page. Open it over https.';return;}
  err.textContent='Checking...';btn.disabled=true;
  try{
    var enc=new TextEncoder();
    var bk=await crypto.subtle.importKey('raw',enc.encode(document.getElementById('pw').value),{name:'PBKDF2'},false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA));
    var html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch(ex){err.textContent='Wrong password. Please try again.';btn.disabled=false;}
});
